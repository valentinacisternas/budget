<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Budget</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --card-2: #f8f5ee; --ink: #1c2420; --ink-2: #3d4842; --muted: #7d867f; --line: #e5e0d4;
    --accent: #1f7a5a; --accent-2: #145a42; --accent-soft: #dcefe6;
    --plum: #8a4f7d; --plum-soft: #f2e4ee; --sun: #c98a1b; --sun-soft: #f8ecd2; --red: #c4473a; --red-soft: #f8e1dd;
    --shadow: 0 1px 2px #1c24200a, 0 4px 14px #1c24200d;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1b201d; --card-2: #222824; --ink: #eef2ee; --ink-2: #c5cdc7; --muted: #8b958e; --line: #2c342f;
      --accent: #4cc093; --accent-2: #2f9a70; --accent-soft: #173327;
      --plum: #d39ac6; --plum-soft: #352232; --sun: #e9b75a; --sun-soft: #352a15; --red: #ee7d70; --red-soft: #3a1f1b;
      --shadow: 0 1px 2px #0006, 0 4px 14px #0004;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 24px; }
  h1 { font-size: 26px; margin: 8px 0 2px; letter-spacing: -.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button { font: inherit; border: 0; cursor: pointer; border-radius: 12px; padding: 10px 14px; background: var(--card-2); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  button.danger { color: var(--red); background: var(--red-soft); }
  button.icon { padding: 6px 10px; background: transparent; color: var(--muted); font-size: 18px; }
  input, select { font: inherit; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.amt { text-align: right; width: 110px; flex: none; }

  .monthbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .monthbar h1 { flex: 1; text-align: center; margin: 0; font-size: 22px; }
  .hero { background: var(--accent); color: #fff; border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
  .hero.neg { background: var(--red); }
  .hero .big { font-size: 38px; font-weight: 700; letter-spacing: -.02em; }
  .hero .lbl { opacity: .85; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .stats div { background: #ffffff22; border-radius: 12px; padding: 8px 10px; }
  .stats b { display: block; font-size: 15px; }
  .stats span { font-size: 11px; opacity: .85; }

  .line { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .line:first-child { border-top: 0; }
  .line .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line.total { font-weight: 700; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--card-2); color: var(--ink-2); }

  .bar { height: 8px; background: var(--card-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--plum); border-radius: 99px; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  nav.tabs button { flex: 1; background: transparent; color: var(--muted); padding: 6px 2px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }

  .fab { position: fixed; right: 18px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 30px; line-height: 56px; padding: 0; box-shadow: 0 6px 20px #0003; z-index: 11; }

  dialog { border: 0; border-radius: 20px; padding: 18px; background: var(--card); color: var(--ink); width: min(440px, calc(100vw - 32px)); box-shadow: 0 20px 60px #0005; }
  dialog::backdrop { background: #0006; }
  dialog h3 { margin: 0 0 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { padding: 6px 12px; border-radius: 99px; font-size: 13px; }
  .chips button.on { background: var(--accent); color: #fff; }

  .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--muted); font-size: 10px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  /* Deseos: warm cards */
  :root { --wish-bg: #f6efe6; --wish-card: #fffaf4; --wish-dark: #2e211c; --wish-accent: #d4664f; --coin: #f2c14e; --coin-edge: #c9952a;
    --lid: #a8744f; --lid-2: #8a5c3c; --glass: #3d4f7a; --glass-edge: #2a3656; }
  @media (prefers-color-scheme: dark) { :root { --wish-bg: #1d1714; --wish-card: #2a221d; --wish-dark: #3a2b24; --wish-accent: #ef8a72; } }
  body.wishmode { background: var(--wish-bg); }
  /* Deudas: the mountain */
  :root { --mtn-sky-1: #f6d9c4; --mtn-sky-2: #f9ece0; --mtn-sun: #f4b860; --mtn-back: #b9c7d6; --mtn-rock: #8d7b6e; --mtn-hill: #6f9e6a;
    --mtn-lake: #6aa7c9; --mtn-trail: #f1e3c6; --mtn-trail-done: #d4664f; --mtn-ink: #2e211c; --mtn-flag: #d4664f; --mtn-me: #f2c14e; }
  @media (prefers-color-scheme: dark) { :root { --mtn-sky-1: #2b2340; --mtn-sky-2: #4a3550; --mtn-sun: #f1d59a; --mtn-back: #4b5568; --mtn-rock: #6b5b52; --mtn-hill: #3f6b45; --mtn-trail: #d9c8a6; } }
  .mtn { margin: 8px -16px 0; position: relative; }
  .mtn svg { display: block; }
  .mtn-panel { background: var(--wish-card); margin: -26px 12px 0; border-radius: 24px 24px 20px 20px; padding: 16px 18px; position: relative; text-align: center; box-shadow: var(--shadow); }
  .mtn-next { display: inline-block; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 10px; border: 1.5px dashed var(--sun); background: var(--sun-soft); color: var(--ink); margin-bottom: 6px; }
  .wish h1, .wish h3 { letter-spacing: -.02em; font-weight: 800; }
  .wish h3 { margin: 0; font-size: 18px; }
  .wh { margin: 22px 2px 10px; }
  .pill { border-radius: 99px; padding: 9px 16px; font-weight: 700; background: var(--wish-accent); color: #fff; }
  .pill.dark { background: var(--wish-dark); color: #fff; }
  .pill.ghostpill { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .jarcard { background: var(--wish-dark); color: #fff; border-radius: 24px; padding: 20px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
  .jarcard .eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; font-weight: 700; }
  .jarcard .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 6px; }
  .jar { flex: none; }
  .wcard { background: var(--wish-card); border-radius: 20px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .wcard.ready { border: 2px solid var(--wish-dark); }
  .wicon { width: 40px; height: 40px; border-radius: 12px; background: var(--card-2); display: grid; place-items: center; font-size: 20px; flex: none; }
  .wnote { background: var(--card-2); border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 14px; color: var(--ink-2); }
  .chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--card-2); color: var(--ink-2); white-space: nowrap; }
  .payday { float: right; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 10px; border: 1.5px dashed #ffffffaa; transform: rotate(4deg); }
  .kept { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); transform: rotate(-1deg); }
  .eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
  :root { --jar-lid: #d9cbbb; --jar-glass: #f3ece4; --jar-edge: #d9cbbb; }
  @media (prefers-color-scheme: dark) { :root { --jar-lid: #5a4a3f; --jar-glass: #2f2722; --jar-edge: #5a4a3f; } }
  .seg { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; margin-bottom: 16px; }
  .seg button { flex: 1; background: transparent; padding: 8px; border-radius: 10px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .goal-hero { text-align: center; padding: 6px 0 4px; }
  .goal-hero .tilt { display: inline-block; transform: rotate(-3deg); filter: drop-shadow(0 8px 16px #0002); }
  .ms { position: relative; height: 8px; background: var(--card-2); border-radius: 99px; margin: 14px 18px 10px; }
  .ms b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; }
  .ms i { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); z-index: 1; }
  .ms i.on { border-color: var(--ink); }
  .pill.wide { width: 100%; padding: 14px; font-size: 16px; margin-top: 12px; }
  .addchip { font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 99px; background: var(--red-soft); color: var(--red); flex: none; }
  .stashes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stash { background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
  .sicon { width: 34px; height: 34px; border-radius: 10px; background: var(--card-2); display: grid; place-items: center; font-size: 18px; flex: none; }
  .sicon.big-icon { width: 72px; height: 72px; border-radius: 22px; font-size: 38px; margin: 0 auto; }
  .sname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sleft { font-size: 20px; font-weight: 800; margin-top: 10px; letter-spacing: -.01em; }
  .sleft span { font-size: 12px; font-weight: 500; color: var(--muted); }
  .sleft.over { color: var(--red); }
  .stash-hero { text-align: center; padding: 8px 4px 18px; }
  .chip.ok { background: var(--accent-soft); color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"></main>

<button class="fab" id="fab" aria-label="Anotar gasto">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mes</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Gastos</button>
  <button data-tab="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v18M17 7H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg>Deudas</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumen</button>
  <button data-tab="wish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10M8 4v3a4 4 0 0 0-2 3.5V18a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-7.5A4 4 0 0 0 16 7V4"/><path d="M6 14h12"/></svg>Metas</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
</nav>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="fileCsv" accept=".csv,text/csv,.json,application/json" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
"use strict";
const APP_VERSION = "2026-11-20.7"; // bump on every release; the app compares it with the published page
/* ---------- data ---------- */
const KEY = "budget-app:v1";
const SECTIONS = [
  { id: "fixed", label: "Gastos fijos", hint: "Se copian cada mes" },
  { id: "variable", label: "Gastos variables", hint: "Klarna, cuotas, etc. Se copian cada mes" },
  { id: "oneTime", label: "Gastos únicos", hint: "Solo este mes" },
  { id: "savings", label: "Ahorro", hint: "Lo que apartas cada mes" },
];
const UNCAT = "Sin categoría";
const N26CAT = "N26 (día a día)";
const DEFAULT_CATS = ["Supermercado", "Comida fuera", "Transporte", "Casa", "Salud", "Ropa", "Ocio", "Cuidado personal", "Compras", "Efectivo",
  "Suscripciones", "Viajes", "Regalos", "Seguros", "Transferencias", N26CAT, "Otros", UNCAT];

const uid = () => Math.random().toString(36).slice(2, 10);
const ymNow = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); };
const ymShift = (ym, n) => { let [y, m] = ym.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + "-" + String(m).padStart(2, "0"); };
const ymLabel = (ym, short) => { const [y, m] = ym.split("-").map(Number);
  const s = new Date(y, m - 1, 1).toLocaleDateString("es", { month: short ? "short" : "long", year: short ? "2-digit" : "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1); };
const eur = (n, dec = true) => (Number(n) || 0).toLocaleString("de-DE", { style: "currency", currency: "EUR", minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: dec ? 2 : 0 });
const num = (v) => { if (typeof v === "number") return v; const s = String(v ?? "").trim().replace(/[€\s]/g, ""); if (!s) return 0;
  const n = s.includes(",") ? Number(s.replace(/\./g, "").replace(",", ".")) : Number(s); return isFinite(n) ? n : 0; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = (arr, f = (x) => x.amount) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

function blankMonth() { return { income: [], fixed: [], variable: [], oneTime: [], savings: [], expenses: [], spendBudget: 0 }; }
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!d || !d.months) d = { months: {}, debts: [], cats: DEFAULT_CATS.slice() };
  d.tx = d.tx || {}; d.overrides = d.overrides || {}; d.rules = d.rules || defaultRules();
  // base salary by month it applies to (the salary paid at the end of November is the December budget)
  d.salary = d.salary || [];
  d.wish = d.wish || [];
  d.limits = d.limits || {};
  d.goals = d.goals || [];
  return d;
}
let db = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("No se pudo guardar"); } }

let state = { tab: "month", ym: ymNow(), spendFilter: "" };
try { const s = JSON.parse(localStorage.getItem(KEY + ":ui")); if (s) state = { ...state, tab: s.tab || state.tab }; } catch (e) {}
const saveUi = () => { try { localStorage.setItem(KEY + ":ui", JSON.stringify({ tab: state.tab })); } catch (e) {} };

/* month helpers */
function baseSalary(ym) { let a = 0; db.salary.slice().sort((x, y) => x.from.localeCompare(y.from)).forEach((s) => { if (s.from <= ym) a = s.amount; }); return a; }
function ensureSalary(m) {
  let line = m.income.find((x) => x.salary || norm(x.name) === "sueldo");
  if (!line) { line = { id: uid(), name: "Sueldo", amount: 0 }; m.income.unshift(line); }
  line.salary = true; line.auto = true; return line;
}
const getMonth = (ym) => db.months[ym];
function latestBefore(ym) { return Object.keys(db.months).filter((k) => k < ym).sort().pop(); }
function createMonth(ym, fromYm) {
  const m = blankMonth(); const src = fromYm && db.months[fromYm];
  if (src) {
    // the plan for the new month follows what was really paid last month
    // A line the bank charged is carried over only when it repeats (charged the month before too), so one-off
    // payments don't become a plan. A line not charged (yet) is already a plan line: always carry it, so
    // copying into future months keeps rent and bills.
    const before = db.months[ymShift(fromYm, -1)];
    const repeats = (x, sec) => !x.auto || x.paid == null || (!!before && before[sec].some((y) => y.name === x.name && y.paid != null));
    // savings: a month with withdrawals must not plan negative savings; keep the usual deposit instead
    const next = (x, sec) => sec !== "savings" ? (x.paid != null ? x.paid : x.amount) : Math.max(0, x.paid > 0 ? x.paid : x.amount);
    const copy = (list, sec) => list.filter((x) => x.salary || repeats(x, sec)).map((x) => { const { paid, manual, ...rest } = x; return { ...rest, amount: next(x, sec), id: uid() }; });
    m.income = copy(src.income, "income"); m.fixed = copy(src.fixed, "fixed"); m.variable = copy(src.variable, "variable"); m.savings = copy(src.savings, "savings");
    m.spendBudget = src.spendBudget || 0;
  }
  db.months[ym] = m; ensureSalary(m);
  // continuing debts: carry this month's planned payment from the previous one
  db.debts.forEach((d) => { if (!d.closed && !d.plan && fromYm && d.payments[fromYm] != null && d.payments[ym] == null && (!d.total || debtLeft(d, ym) > 0)) d.payments[ym] = d.monthly || d.payments[fromYm]; });
  save(); return m;
}
/* A month is "closed" once the bank statement goes past it: auto lines that the bank never charged count as 0. */
function lastBankYm() { let max = ""; for (const t of Object.values(db.tx)) if (t.date > max) max = t.date; return max.slice(0, 7); }
function isClosed(ym) { const l = lastBankYm(); return !!l && ym < l; }
// income from the bank only counts once it has arrived; planned costs count until the month is over
function eff(x, ym, sec) { if (x.salary) return x.paid != null ? x.paid : x.manual ? Number(x.amount) || 0 : baseSalary(ym);
  return x.paid != null ? x.paid : x.auto && (sec === "income" || isClosed(ym)) ? 0 : Number(x.amount) || 0; }
function totals(m, ym) {
  const s = (list, sec) => sum(list, (x) => eff(x, ym, sec));
  const income = s(m.income, "income"), fixed = s(m.fixed), variable = s(m.variable), oneTime = s(m.oneTime), savings = s(m.savings);
  const debt = sum(db.debts, (d) => debtFor(d, ym));
  const spent = sum(m.expenses);
  const planned = fixed + variable + oneTime + debt;
  const left = income - planned - savings - spent;
  return { income, fixed, variable, oneTime, savings, debt, spent, planned, left, outflow: planned + spent };
}
function debtPaid(d, uptoYm) { return Object.entries(d.payments).filter(([k]) => !uptoYm || k <= uptoYm).reduce((a, [, v]) => a + (Number(v) || 0), 0); }
function debtLeft(d, uptoYm) {
  // a loan with a repayment schedule: what is left is the capital still to repay (interest not included)
  if (d.principal) return round2(sum(Object.entries(d.principal).filter(([k]) => k >= (uptoYm || ymNow())), ([, v]) => v));
  if (d.plan) return round2(sum(Object.entries(d.plan).filter(([k]) => k >= (uptoYm || ymNow())), ([, v]) => v));
  return Math.max(0, (Number(d.total) || 0) - debtPaid(d, uptoYm));
}
/* What a debt costs in a month: closed months = what left the bank; the current month = bank so far + what is

function debtFor(d, ym) {
  const hasBank = !!(d.bank && d.bank[ym]), planned = d.plan && d.plan[ym] != null && !isClosed(ym) ? d.plan[ym] : 0;
  if (hasBank || (d.plan && d.plan[ym] != null)) return round2((hasBank ? d.payments[ym] || 0 : 0) + planned);
  return Number(d.payments[ym]) || 0;
}

/* Payday: the salary paid at month end starts the next budget month. */

  if (today >= day) return { badge: "💸 día de sueldo", line: `Empieza ${ymLabel(ymShift(ym, 1)).toLowerCase()}: mira el mes siguiente` };
  const n = day - today;
  return { line: left > 0 ? `unos <b>${eur(left / n, false)} al día</b> por ${n} ${n === 1 ? "día" : "días"} hasta el sueldo` : `${n} ${n === 1 ? "día" : "días"} hasta el sueldo` };
}
/* Month closed: what came in, what went out, what you kept. Shown at the top of the following month. */
function keptCard(ym) {
  const prev = ymShift(ym, -1), m = getMonth(prev); if (!m || !isClosed(prev) || ym > ymNow()) return "";
  const t = totals(m, prev), out = t.outflow + t.savings;
  return `<div class="kept" data-act="goMonth" data-ym="${prev}">
    <div class="small muted" style="margin-bottom:6px">Cierre de ${ymLabel(prev).toLowerCase()}</div>

    <div class="row" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span class="grow eyebrow" style="color:${t.left >= 0 ? "var(--accent)" : "var(--red)"}">${t.left >= 0 ? "Te quedó" : "Te faltó"}</span><b class="num" style="font-size:22px;color:${t.left >= 0 ? "var(--accent)" : "var(--red)"}">${eur(Math.abs(t.left))}</b></div>

function viewMonth() {

function section(id, label, list, hint) {

/* Category budgets ("bolsillos"): every category can get a monthly limit; the card shows what is left
   and how much that is per day for the rest of the month. */
const CAT_ICON = { Supermercado: "🛒", "Comida fuera": "🍔", Transporte: "🚇", Casa: "🏠", Salud: "💊", Ropa: "👗", Ocio: "🎮",
  "Cuidado personal": "💅", Compras: "🛍️", Efectivo: "💶", Suscripciones: "📺", Viajes: "✈️", Regalos: "🎁", Seguros: "🛡️",
  Transferencias: "🔁", [N26CAT]: "💳", Otros: "📦", [UNCAT]: "❓" };
const catIcon = (c) => CAT_ICON[c] || "🏷️";
function stashLimit(cat, ym) { const top = ((getMonth(ym) || {}).tops || {})[cat] || 0; return ((db.limits || {})[cat] || 0) + top; }

  const cur = ymNow(); if (ym < cur) return 0;

}

  const spent = sum(m.expenses.filter((e) => (e.cat || "Otros") === cat)), limit = stashLimit(cat, ym), left = limit - spent, days = daysLeft(ym);
  return { spent, limit, left, days, perDay: limit && left > 0 && days ? left / days : 0 };
}
function expRow(e) {
  return `<div class="line" data-act="editExp" data-id="${e.id}"><span class="small muted num" style="width:44px">${e.date ? e.date.slice(8, 10) + "." + e.date.slice(5, 7) : ""}</span><span class="name">${esc(e.note || e.cat)}${e.note && !state.stash ? ` <span class="tag">${esc(e.cat)}</span>` : ""}${e.src === "bank" ? ` <span class="tag">${e.acct === "n26" ? "N26" : "CB"}</span>` : ""}</span><span class="num">${eur(e.amount)}</span></div>`;
}
function viewSpend() {
  const m = getMonth(state.ym);
  let html = monthBar();
  if (!m) { app.innerHTML = html + `<div class="card empty">Primero crea el presupuesto de este mes en <b>Mes</b>.</div>`; return; }
  const list = m.expenses.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  if (state.stash) return viewStash(m, state.stash, list, html);
  const byCat = {}; list.forEach((e) => (byCat[e.cat || "Otros"] = (byCat[e.cat || "Otros"] || 0) + e.amount));
  const cats = [...new Set([...Object.keys(db.limits || {}).filter((c) => db.limits[c] > 0), ...Object.keys(byCat)])]
    .map((c) => ({ c, ...stashNumbers(m, c, state.ym) }))
    .sort((a, b) => (b.limit > 0) - (a.limit > 0) || b.spent - a.spent);
  const unc = list.filter((e) => e.cat === UNCAT).length;
  if (unc && state.spendFilter !== UNCAT) html += `<div class="card" data-act="filter" data-cat="${UNCAT}" style="background:var(--sun-soft)"><b>${unc} movimientos sin categoría</b><div class="small">Tócalos para decir qué son. La app recuerda tu respuesta para los próximos.</div></div>`;
  html += `<h2>Bolsillos <span class="small muted" style="text-transform:none;letter-spacing:0">toca uno para ponerle límite</span></h2>`;
  if (!cats.length) html += `<div class="card muted small">Anota gastos con el botón + o importa un extracto.</div>`;
  html += `<div class="stashes">${cats.map((x) => {
    const over = x.limit && x.left < 0;
    return `<div class="stash" data-act="openStash" data-cat="${esc(x.c)}"><div class="row" style="gap:8px"><span class="sicon">${catIcon(x.c)}</span><b class="grow sname">${esc(x.c)}</b></div>
      ${x.limit ? `<div class="num sleft ${over ? "over" : ""}">${eur(Math.abs(x.left), false)} <span>${over ? "pasado" : "quedan"}</span></div>
        <div class="bar"><i style="width:${Math.min(100, (x.spent / x.limit) * 100)}%;background:${over ? "var(--red)" : x.spent / x.limit > 0.8 ? "var(--sun)" : "var(--accent)"}"></i></div>`
      : `<div class="num sleft">${eur(x.spent, false)} <span>gastado</span></div><div class="small muted">sin límite</div>`}
    </div>`; }).join("")}</div>`;
  const shown = state.spendFilter ? list.filter((e) => (e.cat || "Otros") === state.spendFilter) : list;
  html += `<h2>${state.spendFilter ? esc(state.spendFilter) : "Todos"} · ${eur(sum(shown))} ${state.spendFilter ? `<button class="ghost" data-act="filter" data-cat="">Quitar filtro</button>` : ""}</h2><div class="card">`;
  if (!shown.length) html += `<div class="muted small">Nada todavía.</div>`;

  const top = ((m.tops || {})[cat]) || 0;

    </div>

/* Debt mountain: a trail from the bottom to the summit; the marker sits where the payments got you. */
const MILESTONES = [{ at: 0.25, name: "Primer refugio" }, { at: 0.5, name: "La laguna" }, { at: 0.75, name: "El mirador" }, { at: 1, name: "La cumbre" }];
const TRAIL = [[170, 262], [250, 240], [118, 214], [232, 186], [132, 160], [214, 132], [152, 104], [190, 80], [170, 52]];
function trailPoint(f) {
  const seg = TRAIL.slice(1).map((p, i) => Math.hypot(p[0] - TRAIL[i][0], p[1] - TRAIL[i][1]));
  let d = Math.max(0, Math.min(1, f)) * seg.reduce((a, b) => a + b, 0);
  for (let i = 0; i < seg.length; i++) { if (d <= seg[i]) { const t = d / seg[i], a = TRAIL[i], b = TRAIL[i + 1]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; } d -= seg[i]; }
  return TRAIL[TRAIL.length - 1];
}
function mountainSvg(p) {
  const pts = TRAIL.map((x) => x.join(",")).join(" ");
  const done = [], steps = 40; for (let i = 0; i <= steps; i++) { const f = (i / steps) * p; done.push(trailPoint(f).map((v) => v.toFixed(1)).join(",")); }
  const [mx, my] = trailPoint(p);
  const stones = MILESTONES.slice(0, 3).map((m) => { const [x, y] = trailPoint(m.at); return `<circle cx="${x}" cy="${y}" r="5" fill="${p >= m.at ? "var(--mtn-trail-done)" : "#fff"}" stroke="var(--mtn-ink)" stroke-width="2"/>`; }).join("");
  return `<svg viewBox="0 0 340 280" width="100%" role="img" aria-label="Montaña de deudas: ${Math.round(p * 100)}% subido">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--mtn-sky-1)"/><stop offset="1" stop-color="var(--mtn-sky-2)"/></linearGradient></defs>
    <rect width="340" height="280" fill="url(#sky)"/>
    <circle cx="282" cy="52" r="20" fill="var(--mtn-sun)"/>
    <path d="M-10 280 L70 130 L130 210 L190 120 L260 220 L350 140 V280 Z" fill="var(--mtn-back)"/>
    <path d="M20 280 L170 40 L320 280 Z" fill="var(--mtn-rock)"/>
    <path d="M170 40 L196 82 L182 76 L170 90 L158 76 L144 82 Z" fill="#fff"/>
    <path d="M-10 280 Q60 220 120 240 T240 236 T350 226 V280 Z" fill="var(--mtn-hill)"/>
    <ellipse cx="96" cy="166" rx="26" ry="8" fill="var(--mtn-lake)" opacity=".9"/>
    <polyline points="${pts}" fill="none" stroke="var(--mtn-trail)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${done.join(" ")}" fill="none" stroke="var(--mtn-trail-done)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    ${stones}
    <line x1="170" y1="52" x2="170" y2="24" stroke="var(--mtn-ink)" stroke-width="2.5"/><path d="M170 24 L192 31 L170 38 Z" fill="var(--mtn-flag)"/>
    <g transform="translate(${mx.toFixed(1)} ${my.toFixed(1)})"><circle r="11" fill="var(--mtn-ink)"/><circle r="7" fill="var(--mtn-me)"/></g>
  </svg>`;
}
function viewDebts() {
  let html = `<h1>Deudas</h1><p class="sub">Lo que pagas cada mes y lo que queda.</p>`;
  const open = db.debts.filter((d) => !d.closed), closed = db.debts.filter((d) => d.closed);
  const totalLeft = sum(open, (d) => debtLeft(d));
  const perMonth = sum(open, (d) => (d.plan ? debtFor(d, ymNow()) : d.monthly || 0));
  // the mountain: debts where we know what is left (a plan or an original total)
  const climb = open.filter((d) => d.plan || d.total);
  // paid so far: for a loan, the capital already repaid (original amount minus what is left)
  const cLeft = sum(climb, (d) => debtLeft(d)), cPaid = sum(climb, (d) => (d.principal && d.total ? Math.max(0, d.total - debtLeft(d)) : debtPaid(d, ymShift(ymNow(), -1))));
  if (climb.length && cLeft + cPaid > 0) {
    html = `<div class="mtn">${mountainSvg(cPaid / (cPaid + cLeft))}
      <div class="mtn-panel">${(() => { const p = cPaid / (cPaid + cLeft), nx = MILESTONES.find((m) => m.at > p + 1e-9);
        return nx ? `<div class="mtn-next">⚑ siguiente: ${nx.name} · faltan ${eur(nx.at * (cPaid + cLeft) - cPaid, false)}</div>` : `<div class="mtn-next">⚑ ¡llegaste a la cumbre!</div>`; })()}
        <div class="big num" style="font-size:38px;font-weight:800;letter-spacing:-.02em">${eur(cLeft, false)}</div>
        <div class="small">por subir · <b>${eur(cPaid, false)}</b> pagados hasta ahora</div>
        <div class="small muted" style="margin-top:6px">${climb.map((d) => esc(d.name)).join(", ")} · ${eur(perMonth, false)} al mes en todas tus deudas${open.length > climb.length ? ` (${open.filter((d) => !d.plan && !d.total).map((d) => esc(d.name)).join(", ")} sin total: no está en la montaña)` : ""}</div>
      </div></div>` + html.replace(`<h1>Deudas</h1>`, `<h1 style="margin-top:18px">Deudas</h1>`);
  } else if (open.length) html += `<div class="hero" style="background:var(--plum)"><div class="lbl">Pagas al mes</div><div class="big num">${eur(perMonth)}</div>
    <div class="lbl" style="margin-top:4px">Pon el total original en cada deuda para ver cuánto queda.</div></div>`;

function chart(rows) {
  const W = 340, H = 180, pad = 22, bw = Math.min(30, (W - pad) / rows.length - 8);
  const max = Math.max(1, ...rows.map((r) => Math.max(r.income, r.outflow + r.savings)));
  const step = (W - pad) / rows.length;
  const y = (v) => H - 18 - (v / max) * (H - 30);
  let g = "";
  rows.forEach((r, i) => {
    const x = pad + i * step + (step - bw) / 2;
    const parts = [[r.fixed, "var(--sun)"], [r.variable + r.debt, "var(--plum)"], [r.oneTime + r.spent, "var(--red)"], [r.savings, "var(--accent)"], [Math.max(0, r.left), "var(--line)"]];
    let base = 0;
    parts.forEach(([v, c]) => { if (v <= 0) return; const y1 = y(base + v), y0 = y(base); g += `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1)}" fill="${c}"/>`; base += v; });
    g += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${esc(ymLabel(r.ym, true))}</text>`;
  });
  const ticks = [0, max / 2, max].map((v) => `<line x1="${pad}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="0" y="${y(v) + 3}">${Math.round(v / 100) / 10}k</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gastos por mes">${ticks}${g}</svg>`;
}

const BANK_CATS = { lebensmittel: "Supermercado", lebenshaltung: "Supermercado", barsrestaurants: "Comida fuera", restaurantsbars: "Comida fuera",
  gesundheitdrogerien: "Salud", freizeit: "Ocio", shopping: "Compras", onlineeinzelhandel: "Compras", medientelekom: "Suscripciones",

function parseCsv(text) {
  text = text.replace(/^﻿/, "");
  const first = text.slice(0, text.indexOf("\n"));
  const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
const isoDate = (s) => { s = String(s).trim(); const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : s.slice(0, 10); };
function bankRows(text) {
  const rows = parseCsv(text); if (rows.length < 2) throw new Error("El archivo está vacío");
  const h = rows[0].map((x) => x.trim());
  const col = (...names) => { for (const n of names) { const i = h.indexOf(n); if (i >= 0) return i; } return -1; };
  const get = (r, i) => (i >= 0 ? String(r[i] ?? "").trim() : "");
  let out;
  if (h.includes("Buchungstag") && h.includes("Betrag")) {
    const [cD, cA, cT, cU, cS, cE, cK] = [col("Buchungstag"), col("Betrag"), col("Buchungstext"), col("Verwendungszweck"), col("Sender"), col("Empfänger"), col("Kategorie")];
    out = rows.slice(1).map((r) => { const amount = num(get(r, cA)); const txt = (get(r, cT) + " " + get(r, cU)).trim();
      return { acct: "commerzbank", date: isoDate(get(r, cD)), amount, who: get(r, amount < 0 ? cE : cS) || txt.slice(0, 40), text: txt, bankCat: get(r, cK) }; });
  } else if (col("Booking Date", "Date") >= 0 && col("Amount (EUR)", "Amount") >= 0) {
    const [cD, cA, cP, cT, cR, cC] = [col("Booking Date", "Date"), col("Amount (EUR)", "Amount"), col("Partner Name", "Payee"), col("Type", "Transaction type"), col("Payment Reference", "Payment reference"), col("Category")];
    out = rows.slice(1).map((r) => ({ acct: "n26", date: isoDate(get(r, cD)), amount: num(get(r, cA)), who: get(r, cP), text: (get(r, cT) + " " + get(r, cR)).trim(), bankCat: get(r, cC) }));
  } else throw new Error("No reconozco este CSV (Commerzbank o N26)");
  const seen = {};
  return out.filter((t) => /^\d{4}-\d{2}-\d{2}$/.test(t.date) && t.amount).map((t) => {
    const base = `${t.acct}|${t.date}|${t.amount}|${norm(t.who + t.text).slice(0, 60)}`; seen[base] = (seen[base] || 0) + 1;
    return { ...t, text: t.text.slice(0, 220), id: base + "|" + seen[base] };
  });
}
function displayName(t) {
  if (/paypal/i.test(t.who)) { const m = t.text.match(/PP\.\d+\.PP\s*\/?\.?\s*(.+?)(?:,\s*Ihr|\s*End-to-End|$)/); const n = m && m[1].replace(/\s+/g, " ").trim(); if (n && !n.startsWith(",")) return n.slice(0, 40); return "PayPal"; }
  return (t.who || t.text).slice(0, 40);
}
function classify(t) {
  if (db.overrides[t.id]) return db.overrides[t.id];
  const hay = norm(t.who + " " + t.text);
  for (const r of db.rules) {
    if (r.sign && (r.sign === "+") !== t.amount > 0) continue;
    const k = norm(r.match); if (k && hay.includes(k)) return r.to;
  }
  if (t.amount > 0) return { kind: "income", name: "Otros ingresos" };
  const bc = norm(t.bankCat);
  if (bc === "investitionen") return { kind: "savings", name: "Inversiones" };
  return { kind: "cat", cat: BANK_CATS[bc] || UNCAT };
}
/* Rebuild every bank-derived number from db.tx + rules. Safe to run again and again. */
function applyBank() {
  const txs = Object.values(db.tx).sort((a, b) => a.date.localeCompare(b.date)); if (!txs.length) return;
  const n26Months = new Set(txs.filter((t) => t.acct === "n26").map((t) => t.date.slice(0, 7)));
  const byYm = {};
  txs.forEach((t) => { const to = classify(t); let ym = t.date.slice(0, 7);
    if (to.shift && Number(t.date.slice(8, 10)) >= 20) ym = ymShift(ym, 1); // salary and rent at month end belong to next month
    (byYm[ym] = byYm[ym] || []).push([t, to]); });
  const first = txs[0].date.slice(0, 7);
  const last = [ymNow(), ...Object.keys(byYm)].sort().pop();
  for (let ym = first; ym <= last; ym = ymShift(ym, 1)) {
    const m = db.months[ym] || createMonth(ym, latestBefore(ym)); ensureSalary(m);
    m.expenses = m.expenses.filter((e) => e.src !== "bank");
    ["income", "fixed", "variable", "oneTime", "savings"].forEach((s) => m[s].forEach((x) => delete x.paid));
    db.debts.forEach((d) => { if (d.bank && d.bank[ym]) { delete d.payments[ym]; delete d.bank[ym]; } });
    (byYm[ym] || []).forEach(([t, to]) => {
      let kind = to.kind;
      if (kind === "transfer") { if (n26Months.has(t.date.slice(0, 7))) return; kind = "cat"; to = { kind: "cat", cat: N26CAT }; }
      if (kind === "ignore") return;
      if (kind === "cat") {
        if (!db.cats.includes(to.cat)) db.cats.splice(Math.max(0, db.cats.length - 1), 0, to.cat);
        m.expenses.push({ id: t.id, src: "bank", txid: t.id, amount: -t.amount, cat: to.cat, note: displayName(t), date: t.date, acct: t.acct }); return;
      }
      if (kind === "debt") {
        let d = db.debts.find((x) => norm(x.name) === norm(to.name));
        if (!d) { d = { id: uid(), name: to.name, total: 0, monthly: 0, payments: {}, closed: false }; db.debts.push(d); }
        d.bank = d.bank || {}; if (!d.bank[ym]) { d.payments[ym] = 0; d.bank[ym] = 1; }
        d.payments[ym] = round2(d.payments[ym] - t.amount); d.monthly = d.payments[ym]; return;
      }
      const list = m[kind]; if (!list) return;
      let line = list.find((x) => norm(x.name) === norm(to.name));
      if (!line) { line = { id: uid(), name: to.name, amount: 0, auto: true }; list.push(line); }
      line.auto = true; line.paid = round2((line.paid || 0) + (kind === "income" ? t.amount : -t.amount));
      if (!line.amount) line.amount = line.paid;
    });
  }
  // usual payday = the most common day the salary (a rule with shift) arrives
  const days = txs.filter((t) => t.amount > 0 && classify(t).kind === "income" && classify(t).shift).map((t) => Number(t.date.slice(8, 10))).sort((a, b) => a - b);
  if (days.length) db.payday = days[Math.floor(days.length / 2)];
  // closed months: drop bank lines the bank never charged (e.g. Radio Tax is quarterly)
  Object.entries(db.months).forEach(([ym, m]) => { if (!isClosed(ym)) return;
    ["income", "fixed", "variable", "savings"].forEach((s) => (m[s] = m[s].filter((x) => x.salary || !(x.auto && x.paid == null)))); });
  save();
}
async function importCsv(files) {
  let added = 0, total = 0;
  try {
    for (const f of files) {
      const buf = await f.arrayBuffer(); let text = new TextDecoder("utf-8").decode(buf);
      if (/^\s*\{/.test(text)) { const o = JSON.parse(text); if (o.source === "setup") { importSetup(o); continue; } if (o.source !== "klarna" && o.source !== "debtplan") throw new Error("Ese JSON no es un plan de Klarna ni una configuración (las copias se cargan en Restaurar)"); importKlarna(o); continue; }
      if (text.includes("�")) text = new TextDecoder("windows-1252").decode(buf);
      bankRows(text).forEach((t) => { total++; if (!db.tx[t.id]) { db.tx[t.id] = t; added++; } });
    }
    applyBank(); state.tab = "month"; state.ym = ymNow(); saveUi(); render();
    toast(`${added} movimientos nuevos (${total} leídos)`);
  } catch (err) { toast(err.message || "Error al importar"); }
}
/* Personal rules and base salary live in a private setup file, not in this public code. */
function importSetup(o) {
  if (Array.isArray(o.salary) && o.salary.length) db.salary = o.salary.map((x) => ({ from: x.from, amount: num(x.amount) }));
  const mine = (o.rules || []).map((r) => ({ ...r, id: uid() }));
  const key = (r) => norm(r.match) + "|" + (r.sign || "") + "|" + JSON.stringify(r.to);
  const have = new Set(mine.map(key));
  const rest = db.rules.filter((r) => !have.has(key(r)));
  // "between my accounts" rules go right after the savings rules: moves to savings stay savings,
  // but a transfer with a note like "Klarna" is still a transfer, not a purchase
  const moves = mine.filter((r) => r.to.kind === "transfer"), others = [...mine.filter((r) => r.to.kind !== "transfer"), ...rest];
  let at = -1; others.forEach((r, i) => { if (r.to.kind === "savings") at = i; });
  db.rules = [...others.slice(0, at + 1), ...moves, ...others.slice(at + 1)];
}
/* Payment plans made on the Mac from screenshots: Klarna ("Due in <month>") or a loan's repayment
   schedule ("debtplan": months with the instalment and the principal part, plus balance and rate). */
function importKlarna(o) {
  const name = o.name || "Klarna";
  let d = db.debts.find((x) => norm(x.name) === norm(name));
  if (!d) { d = { id: uid(), name, total: 0, monthly: 0, payments: {}, closed: false }; db.debts.push(d); }
  d.plan = {}; d.planItems = {}; d.planDate = o.date || new Date().toISOString().slice(0, 10); d.closed = false;
  delete d.principal; if (o.rate) d.rate = o.rate;
  Object.entries(o.months || {}).forEach(([ym, m]) => {
    const due = (m.items || []).filter((it) => it.section === "due");
    d.plan[ym] = round2(m.due_total != null ? m.due_total : sum(due));
    if (due.length) d.planItems[ym] = due.map(({ day, merchant, amount, installment }) => ({ day, merchant, amount, installment }));
    if (m.principal != null) (d.principal = d.principal || {})[ym] = m.principal;
  });
  d.total = o.total ? round2(o.total) : round2(debtPaid(d) + debtLeft(d));
}
function allNames() { const s = new Set(); Object.values(db.months).forEach((m) => ["income", "fixed", "variable", "savings"].forEach((k) => m[k].forEach((x) => s.add(x.name)))); db.debts.forEach((d) => s.add(d.name)); return [...s].sort(); }
const KINDS = [["cat", "Gasto del día a día"], ["fixed", "Gasto fijo"], ["variable", "Gasto variable"], ["savings", "Ahorro"], ["debt", "Deuda"], ["income", "Ingreso"], ["ignore", "Ignorar (entre mis cuentas)"]];
function txDialog(txid) {
  const t = db.tx[txid]; if (!t) return;
  const cur = classify(t); const curKind = cur.kind === "transfer" ? "ignore" : cur.kind;
  let cat = cur.kind === "cat" ? cur.cat : UNCAT;
  openDialog(`<form><h3>${eur(t.amount)} · ${esc(displayName(t))}</h3>
    <p class="small muted" style="margin-top:-6px">${t.date.split("-").reverse().join(".")} · ${t.acct === "n26" ? "N26" : "Commerzbank"}${t.bankCat ? " · " + esc(t.bankCat) : ""}<br>${esc(t.text.slice(0, 160))}</p>
    <div class="field"><label>Qué es</label><select name="kind">${KINDS.map(([k, l]) => `<option value="${k}" ${k === curKind ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="field" data-for="cat"><label>Categoría</label><div class="chips" id="catChips">${db.cats.map((c) => `<button type="button" data-cat="${esc(c)}" class="${c === cat ? "on" : ""}">${esc(c)}</button>`).join("")}</div></div>
    <div class="field" data-for="name"><label>Nombre de la línea</label><input name="name" list="names" value="${esc(cur.name || displayName(t))}"><datalist id="names">${allNames().map((n) => `<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="field"><label><input type="checkbox" name="always" checked style="width:auto;vertical-align:-2px"> Hacer lo mismo con todo lo que contenga:</label><input name="match" value="${esc(displayName(t))}"></div>
    <div class="actions"><button type="button" data-close>Cancelar</button><button class="primary">Guardar</button></div></form>`,
  (d) => {
    const f = d.querySelector("form");
    const sync = () => { const k = f.kind.value; d.querySelector('[data-for="cat"]').hidden = k !== "cat"; d.querySelector('[data-for="name"]').hidden = k === "cat" || k === "ignore"; };
    f.kind.onchange = sync; sync();
    d.querySelector("#catChips").onclick = (ev) => { const b = ev.target.closest("button"); if (!b) return; cat = b.dataset.cat; d.querySelectorAll("#catChips button").forEach((x) => x.classList.toggle("on", x === b)); };
    d.querySelector("[data-close]").onclick = () => d.close();
    f.onsubmit = (ev) => { ev.preventDefault();
      const k = f.kind.value; const name = f.name.value.trim();
      if (k !== "cat" && k !== "ignore" && !name) return;
      const to = k === "cat" ? { kind: k, cat } : k === "ignore" ? { kind: k } : { kind: k, name };
      const match = f.match.value.trim();
      if (f.always.checked && norm(match)) { delete db.overrides[t.id]; db.rules.unshift({ id: uid(), match, to, sign: t.amount > 0 ? "+" : "-" }); }
      else db.overrides[t.id] = to;
      applyBank(); d.close(); render(); toast(f.always.checked ? "Regla guardada" : "Guardado");
    };
  });
}
const ruleLabel = (to) => to.kind === "cat" ? to.cat : to.kind === "ignore" || to.kind === "transfer" ? "entre mis cuentas" : `${KINDS.find((k) => k[0] === to.kind)?.[1] || to.kind}: ${to.name}`;

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act],[data-tab]"); if (!t || dlg.contains(t)) return;
  if (t.closest("#tabs")) { state.tab = t.dataset.tab; state.spendFilter = ""; state.stash = ""; saveUi(); render(); scrollTo(0, 0); return; }
  const a = t.dataset.act;
  switch (a) {
    case "prev": state.ym = ymShift(state.ym, -1); state.spendFilter = ""; render(); break;
    case "next": state.ym = ymShift(state.ym, 1); state.spendFilter = ""; render(); break;
    case "newFrom": createMonth(state.ym, t.dataset.from); render(); toast("Mes creado"); break;
    case "newBlank": createMonth(state.ym, null); render(); break;
    case "tab": state.tab = t.dataset.tab; saveUi(); render(); scrollTo(0, 0); break;
    case "addItem": itemDialog(t.dataset.sec); break;
    case "editItem": itemDialog(t.dataset.sec, t.dataset.id); break;
    case "editExp": { const ex = getMonth(state.ym)?.expenses.find((x) => x.id === t.dataset.id); if (ex && ex.src === "bank") txDialog(ex.txid); else expenseDialog(t.dataset.id); break; }
    case "filter": state.spendFilter = t.dataset.cat; render(); break;
    case "addDebt": debtDialog(); break;
    case "addWish": wishDialog(); break;
    case "metaSeg": state.metaSeg = t.dataset.seg; render(); break;
    case "addGoal": goalDialog(); break;
    case "editGoal": goalDialog(t.dataset.id); break;
    case "pinGoal": db.goalPin = t.dataset.id; save(); render(); scrollTo(0, 0); break;
    case "goalAdd": e.stopPropagation(); goalAddMoney(t.dataset.id); break;
    case "openStash": state.stash = t.dataset.cat; render(); scrollTo(0, 0); break;
    case "stashBack": state.stash = ""; render(); break;
    case "stashLog": expenseDialog(null, state.stash); break;
    case "stashLimit": { const c = state.stash, v = prompt(`Límite mensual para ${c} (€). 0 = sin límite`, (db.limits || {})[c] || ""); if (v != null) { db.limits = db.limits || {}; if (num(v) > 0) db.limits[c] = num(v); else delete db.limits[c]; save(); render(); } break; }
    case "stashTop": { const c = state.stash, v = prompt(`¿Cuánto sumar a ${c} solo este mes? (€)`); if (v != null && num(v)) { const mm = getMonth(state.ym); mm.tops = mm.tops || {}; mm.tops[c] = round2((mm.tops[c] || 0) + num(v)); save(); render(); toast(`+${eur(num(v))} a ${c} este mes`); } break; }
    case "editWish": wishDialog(t.dataset.id); break;
    case "wishLet": wishDecide(t.dataset.id, "let"); break;
    case "wishBuy": wishDecide(t.dataset.id, "bought"); break;
    case "showDecided": state.showDecided = !state.showDecided; render(); break;
    case "editDebt": debtDialog(t.dataset.id); break;
    case "goMonth": state.ym = t.dataset.ym; state.tab = "month"; saveUi(); render(); scrollTo(0, 0); break;
    case "setBudget": { const v = prompt("Límite mensual para gastos anotados (€). 0 = sin límite", getMonth(state.ym).spendBudget || ""); if (v != null) { getMonth(state.ym).spendBudget = num(v); save(); render(); } break; }
    case "delMonth": if (confirm("¿Borrar " + ymLabel(state.ym) + " con todos sus gastos?")) { delete db.months[state.ym]; db.debts.forEach((d) => delete d.payments[state.ym]); save(); render(); } break;
    case "pickCsv": $("#fileCsv").click(); break;
    case "addSalary": { const a = prompt("Nuevo sueldo base neto (€)"); if (a == null || !num(a)) break; const f = prompt("¿Desde qué mes de presupuesto? (AAAA-MM)", ymShift(ymNow(), 1)); if (!/^\d{4}-\d{2}$/.test(f || "")) break;
      db.salary = db.salary.filter((x) => x.from !== f).concat({ from: f, amount: num(a) }); save(); render(); break; }
    case "editSalary": { const x = db.salary.find((y) => y.from === t.dataset.from); const a = prompt("Sueldo base (€)", String(x.amount).replace(".", ",")); if (a != null && num(a)) { x.amount = num(a); save(); render(); } break; }
    case "delSalary": db.salary = db.salary.filter((x) => x.from !== t.dataset.from); save(); render(); break;
    case "delRule": db.rules = db.rules.filter((r) => r.id !== t.dataset.id); applyBank(); render(); break;
    case "resetRules": if (confirm("¿Volver a las reglas iniciales? Se pierden las que creaste.")) { db.rules = defaultRules(); db.overrides = {}; applyBank(); render(); } break;
    case "showRules": state.showRules = !state.showRules; render(); break;
    case "pickJson": $("#fileJson").click(); break;
    case "export": { const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }); const u = URL.createObjectURL(blob);
      const l = document.createElement("a"); l.href = u; l.download = "budget-" + new Date().toISOString().slice(0, 10) + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); break; }
    case "addCat": { const c = (prompt("Nueva categoría") || "").trim(); if (c && !db.cats.includes(c)) { db.cats.push(c); save(); render(); } break; }
    case "delCat": if (db.cats.length > 1 && confirm("¿Quitar la categoría " + t.dataset.cat + "? Los gastos guardados la mantienen.")) { db.cats = db.cats.filter((c) => c !== t.dataset.cat); save(); render(); } break;
    case "update": checkUpdate(true); break;
    case "wipe": if (confirm("¿Borrar TODO? Exporta una copia antes si la quieres.") && confirm("¿Seguro?")) { localStorage.removeItem(KEY); db = load(); save(); render(); } break;
  }
});
$("#fab").onclick = () => expenseDialog(null, state.tab === "spend" ? state.stash : null);
$("#fileCsv").onchange = (e) => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importCsv(fs); };
$("#fileJson").onchange = async (e) => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.months) throw 0; if (!confirm("¿Reemplazar todo con esta copia?")) return; d.cats = d.cats || DEFAULT_CATS.slice(); d.debts = d.debts || []; d.tx = d.tx || {}; d.overrides = d.overrides || {}; d.rules = d.rules || defaultRules(); db = d; save(); render(); toast("Copia restaurada"); }
  catch (err) { toast("Ese archivo no es una copia válida"); } };

/* The home-screen app can keep an old copy for a while. Ask the server for the page without cache and
   reload with a fresh URL when its version is different. Data stays: it lives in this device's storage. */
async function checkUpdate(manual) {
  try {
    const html = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
    const v = (html.match(/APP_VERSION = "([^"]+)"/) || [])[1];
    if (!v) { if (manual) toast("No pude revisar la versión"); return; }
    if (v === APP_VERSION) { state.newVersion = ""; if (manual) { toast("Ya tienes la última versión"); render(); } return; }
    if (manual) { toast("Actualizando…"); setTimeout(() => location.replace(location.pathname + "?v=" + encodeURIComponent(v)), 400); return; }
    state.newVersion = v; render(); toast("Hay una versión nueva: Más → Actualizar app");
  } catch (e) { if (manual) toast("Sin conexión: no pude revisar"); }
}
render();
checkUpdate(false);
</script>
